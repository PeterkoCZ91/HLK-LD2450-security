name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio==6.1.19 esptool==5.3.1

      - name: Prepare example configuration
        run: |
          cp include/secrets.h.example include/secrets.h
          cp include/ld2450/known_devices.h.example include/ld2450/known_devices.h

      - name: Build release firmware (USB flash, captive portal, MQTTS)
        run: pio run -e ld2450_release

      - name: Merge into single flashable binary
        run: |
          BOOT_APP0="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          test -f "$BOOT_APP0"
          esptool --chip esp32 merge-bin \
            --output firmware-ld2450-${{ github.ref_name }}.bin \
            --flash-mode dio \
            --flash-freq 40m \
            --flash-size 4MB \
            0x1000  .pio/build/ld2450_release/bootloader.bin \
            0x8000  .pio/build/ld2450_release/partitions.bin \
            0xe000  "$BOOT_APP0" \
            0x10000 .pio/build/ld2450_release/firmware.bin
          sha256sum firmware-ld2450-${{ github.ref_name }}.bin > firmware-ld2450-${{ github.ref_name }}.bin.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            ## Quick Flash

            Download the attached firmware binary and SHA-256 checksum, then flash with:

            ```bash
            pip install esptool
            esptool --chip esp32 --port PORT --baud 460800 write-flash 0x0 firmware-ld2450-vX.Y.Z.bin
            ```

            See the [flashing guide](https://github.com/PeterkoCZ91/HLK-LD2450-security/blob/main/docs/flashing.md) for wiring, first-boot setup, and troubleshooting.

            ## What is in this build

            - Environment: `ld2450_release` (USB flash, captive portal, MQTTS support)
            - Chip: ESP32-WROOM-32
            - Flash size: 4 MB, partition scheme: min_spiffs
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "firmware-ld2450-${GITHUB_REF_NAME}.bin" \
            "firmware-ld2450-${GITHUB_REF_NAME}.bin.sha256" \
            --title "${GITHUB_REF_NAME}" \
            --notes "${RELEASE_NOTES}"
